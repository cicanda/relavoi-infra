name: terraform-deploy

on:
  push:
    branches: [main]
    paths:
      - "envs/**"
      - "modules/**"
      - ".github/workflows/deploy.yml"
  workflow_dispatch:
    inputs:
      environment:
        description: "Target environment"
        type: choice
        options: [staging, prod]
        default: staging
      image_tag:
        description: "Backend image tag to deploy"
        type: string
        default: latest

permissions:
  id-token: write # OIDC
  contents: read

env:
  AWS_REGION: af-south-1
  TF_VERSION: 1.7.5
  # Non-secret defaults; secrets come from GitHub Actions secrets below.
  TF_VAR_image_tag: ${{ github.event.inputs.image_tag || 'latest' }}
  TF_VAR_jwt_secret: ${{ secrets.JWT_SECRET }}
  TF_VAR_encryption_master_key: ${{ secrets.ENCRYPTION_MASTER_KEY }}
  TF_VAR_at_api_key: ${{ secrets.AT_API_KEY }}

jobs:
  plan:
    runs-on: ubuntu-latest
    environment: ${{ github.event.inputs.environment || 'staging' }}
    defaults:
      run:
        working-directory: envs/${{ github.event.inputs.environment || 'staging' }}
    steps:
      - uses: actions/checkout@v4

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: terraform init
        run: terraform init -input=false

      - name: terraform plan
        run: terraform plan -input=false -out=tfplan

      - name: upload plan
        uses: actions/upload-artifact@v4
        with:
          name: tfplan-${{ github.event.inputs.environment || 'staging' }}
          path: envs/${{ github.event.inputs.environment || 'staging' }}/tfplan
          retention-days: 1

  apply:
    needs: plan
    runs-on: ubuntu-latest
    # Gate real applies behind the environment's protection rules.
    environment: ${{ github.event.inputs.environment || 'staging' }}
    defaults:
      run:
        working-directory: envs/${{ github.event.inputs.environment || 'staging' }}
    steps:
      - uses: actions/checkout@v4

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: terraform init
        run: terraform init -input=false

      - name: download plan
        uses: actions/download-artifact@v4
        with:
          name: tfplan-${{ github.event.inputs.environment || 'staging' }}
          path: envs/${{ github.event.inputs.environment || 'staging' }}

      - name: terraform apply
        run: terraform apply -input=false tfplan
